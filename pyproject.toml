[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-antipattern-analyzer"
version = "0.1.0"
description = "SQL antipattern detector for Text-to-SQL datasets — config-driven pipeline with severity-based quality scoring"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.0,<3.0",
  "sqlglot>=20.0,<28.0",
  "click>=8.0,<9.0",
  "PyYAML>=6.0,<7.0",
  "dependency-injector>=4.40,<5.0",
  "duckdb>=0.9,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
progress = [
  "tqdm>=4.60",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
text2sql-antipattern = "text2sql_antipattern.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
